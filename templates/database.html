<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Explorer - {{ db_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container-fluid">
                <span class="navbar-brand">
                    <i class="fas fa-database me-2"></i>{{ db_name }}
                </span>
                <div class="d-flex">
                    <a href="{{ url_for('close_database') }}" class="btn btn-outline-light">
                        <i class="fas fa-times me-2"></i>Close Database
                    </a>
                </div>
            </div>
        </nav>

        <div class="row g-0">
            <!-- Sidebar with tables -->
            <div class="col-md-3 sidebar">
                <div class="p-3">
                    <h6><i class="fas fa-list me-2"></i>Tables</h6>
                    <div class="list-group">
                        {% for table in tables %}
                        <button type="button" class="list-group-item list-group-item-action table-item" 
                                data-table="{{ table }}">
                            <i class="fas fa-table me-2"></i>{{ table }}
                        </button>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <!-- Main content area -->
            <div class="col-md-9 main-content">
                <div class="p-3">
                    <div id="welcome-message">
                        <div class="text-center text-muted mt-5">
                            <i class="fas fa-arrow-left fa-3x mb-3"></i>
                            <h4>Select a table from the sidebar to view its contents</h4>
                            <p>You can browse, edit, add, and delete records from any table.</p>
                        </div>
                    </div>

                    <div id="table-content" style="display: none;">
                        <!-- Table controls -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h5 id="current-table-name"><i class="fas fa-table me-2"></i></h5>
                                <small class="text-muted" id="table-info"></small>
                            </div>
                            <div class="btn-group">
                                <button type="button" class="btn btn-success" id="add-row-btn">
                                    <i class="fas fa-plus me-2"></i>Add Row
                                </button>
                                <button type="button" class="btn btn-danger" id="delete-selected-btn" disabled>
                                    <i class="fas fa-trash me-2"></i>Delete Selected
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="refresh-btn">
                                    <i class="fas fa-sync me-2"></i>Refresh
                                </button>
                            </div>
                        </div>

                        <!-- Loading indicator -->
                        <div id="loading" class="text-center p-4" style="display: none;">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Loading table data...</p>
                        </div>

                        <!-- Table container -->
                        <div id="table-container">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover" id="data-table">
                                    <thead class="table-success">
                                        <!-- Dynamic headers -->
                                    </thead>
                                    <tbody>
                                        <!-- Dynamic content -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Pagination -->
                        <nav id="pagination-container" style="display: none;">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- Dynamic pagination -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Row Modal -->
    <div class="modal fade" id="addRowModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Add New Row</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-row-form">
                        <div id="form-fields">
                            <!-- Dynamic form fields -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="save-row-btn">
                        <i class="fas fa-save me-2"></i>Save Row
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
